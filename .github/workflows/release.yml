name: Release Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DISCORDY_GITHUB_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate release tag
        if: github.event_name == 'push'
        run: npm run release:validate

      - name: Typecheck
        run: npm run typecheck

      - name: Security tests
        run: npm run test:security

      - name: Build and publish GitHub Release
        if: github.event_name == 'push'
        run: npm run release:win

      - name: Build artifacts without publishing
        if: github.event_name == 'workflow_dispatch'
        run: npm run dist:win

      - name: Upload manual workflow artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: discordy-windows-${{ github.sha }}
          path: |
            release/Discordy-Setup-*.exe
            release/Discordy-Setup-*.exe.blockmap
            release/Discordy-Portable-*.exe
            release/latest.yml
          if-no-files-found: warn
